version: "3"
services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: postgres:15-alpine
    container_name: database
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - "8080:80"

volumes:
  pgdata:
